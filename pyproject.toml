[project]
name = "import-reconcile"
version = "0.1.0"
description = "Daily reconciliation of a trade ledger against a counterparty statement"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest-playwright>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The browser suite is opt-in: `make verify` must stay runnable by a
# reviewer who has not installed a browser. `make e2e` runs it.
addopts = "-q --strict-markers -m 'not e2e'"
markers = ["e2e: drives a real browser against a real server"]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["core"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true
